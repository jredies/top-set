<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f8fb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Top Set" />
    <meta name="description" content="Your best top set for every exercise, saved on this phone." />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="stylesheet" href="styles.css" />
    <title>Top Set</title>
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <div class="header-actions">
          <button class="undo-button" id="undoButton" type="button" disabled>
            <span class="undo-icon" aria-hidden="true">↶</span>
            <span>Undo</span>
          </button>
          <button class="reset-button" id="resetButton" type="button" disabled>Reset</button>
        </div>
      </header>

      <div id="exerciseList" class="exercise-list"></div>
    </main>

    <div id="liveRegion" class="sr-only" aria-live="polite"></div>
    <div class="dialog-backdrop" id="resetDialog" hidden>
      <div class="reset-dialog" role="dialog" aria-modal="true" aria-labelledby="resetDialogTitle" aria-describedby="resetDialogDescription">
        <div class="dialog-kicker">Safety check</div>
        <h2 id="resetDialogTitle">Reset all best sets?</h2>
        <p id="resetDialogDescription">This clears every saved value on this phone. You can undo this once.</p>
        <div class="dialog-actions">
          <button class="dialog-cancel" id="cancelResetButton" type="button">Cancel</button>
          <button class="dialog-confirm" id="confirmResetButton" type="button">Reset all</button>
        </div>
      </div>
    </div>
    <script src="app.js" defer></script>
  </body>
</html>
